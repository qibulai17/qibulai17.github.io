<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 矩阵切割特效-还原版</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .canvas-container { width: 360px; height: 640px; margin-top: 20px; position: relative; background: #000; }
        canvas { width: 100%; height: 100%; }
        .controls { width: 360px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .file-input-group { background: #333; padding: 12px; border-radius: 8px; text-align: center; }
        input[type="range"] { width: 100%; accent-color: #fb7299; cursor: pointer; }
        button { padding: 15px; background: #fb7299; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:disabled { background: #666; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #fb7299; font-weight: bold; }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 隐藏资源 -->
    <video id="maskVideo" src="mask.mp4" muted playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="sourceVideo" muted playsinline crossorigin="anonymous" style="display:none;"></video>

    <div class="controls">
        <div class="file-input-group">
            <label>第一步：导入你的 5 秒原视频</label>
            <input type="file" id="uploadSource" accept="video/*">
        </div>

        <div class="file-input-group">
            <label>第二步：预览 3x3 切割进度 (0-5s)</label>
            <input type="range" id="previewBar" min="0" max="5" step="0.1" value="0">
            <div style="display:flex; justify-content: space-between; font-size: 12px; margin-top: 5px;">
                <span>0.0s</span>
                <span id="timeVal">0.0s</span>
                <span>5.0s</span>
            </div>
        </div>
        
        <button id="exportBtn">导出 3x3 矩阵特效视频</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const maskVideo = document.getElementById('maskVideo');
        const sourceVideo = document.getElementById('sourceVideo');
        const uploadSource = document.getElementById('uploadSource');
        const previewBar = document.getElementById('previewBar');
        const timeVal = document.getElementById('timeVal');
        const exportBtn = document.getElementById('exportBtn');

        // 设置 9:16 高清画布
        canvas.width = 720;
        canvas.height = 1280;

        uploadSource.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                sourceVideo.src = URL.createObjectURL(file);
                sourceVideo.onloadedmetadata = () => render();
            }
        };

        // 核心：3x3 矩阵切割与蒙版算法
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!sourceVideo.src) return;

            const grid = 3; // 3x3 切割
            const cellW = canvas.width / grid;
            const cellH = canvas.height / grid;

            // 循环绘制 9 个格子
            for (let row = 0; row < grid; row++) {
                for (let col = 0; col < grid; col++) {
                    const x = col * cellW;
                    const y = row * cellH;

                    ctx.save();
                    // 1. 创建切割路径
                    ctx.beginPath();
                    ctx.rect(x, y, cellW, cellH);
                    ctx.clip();

                    // 2. 绘制原视频（不拉伸，填满格子）
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);

                    // 3. 应用蒙版：根据 mask.mp4 对应位置的黑白度来“擦除”
                    ctx.globalCompositeOperation = 'destination-out';
                    // 关键：绘制 maskVideo，它会自动作用于当前被 clip 的格子
                    ctx.drawImage(maskVideo, 0, 0, canvas.width, canvas.height);
                    
                    ctx.restore();
                }
            }
        }

        // 进度预览同步
        previewBar.oninput = () => {
            const t = parseFloat(previewBar.value);
            maskVideo.currentTime = t;
            if (sourceVideo.duration) sourceVideo.currentTime = t % sourceVideo.duration;
            timeVal.innerText = t.toFixed(1) + 's';
        };

        maskVideo.onseeked = render;
        sourceVideo.onseeked = render;

        // 导出 5 秒视频
        exportBtn.onclick = async () => {
            if (!sourceVideo.src) return alert("请先上传原视频！");
            exportBtn.disabled = true;
            exportBtn.innerText = "录制中...";

            const chunks = [];
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "3x3_result.mp4";
                a.click();
                exportBtn.disabled = false;
                exportBtn.innerText = "导出 3x3 矩阵特效视频";
            };

            maskVideo.currentTime = 0;
            sourceVideo.currentTime = 0;
            recorder.start();
            maskVideo.play();
            sourceVideo.play();

            setTimeout(() => {
                recorder.stop();
                maskVideo.pause();
                sourceVideo.pause();
            }, 5000);
        };
    </script>
</body>
</html>
