<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频特效生成器</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; padding: 20px; }
        .container { position: relative; width: 360px; height: 640px; background: #fff; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        /* 强制视频填满并背景变白，防止黑边干扰 */
        canvas, video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; }
        #maskVideo { display: none; } /* 隐藏原始遮罩视频 */
        
        .controls { width: 360px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .progress-container { background: #fff; padding: 10px; border-radius: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button { padding: 12px; background: #00A1D6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        .info { font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 底部原图（你可以根据需要更换图片链接） -->
        <img id="baseImg" src="https://via.placeholder.com/360x640" style="width:100%; height:100%; object-fit: cover;">
        <!-- 上层画布：用来混合 mask.mp4 的特效 -->
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 隐藏的遮罩视频源 -->
    <video id="maskVideo" src="mask.mp4" muted playsinline></video>

    <div class="controls">
        <div class="progress-container">
            <label>预览进度 (0-5秒)：<span id="timeDisplay">0.0</span>s</label>
            <input type="range" id="timeSlider" min="0" max="5" step="0.1" value="0">
        </div>
        
        <button id="recordBtn">生成并下载 5 秒视频</button>
        <p class="info">提示：拖动进度条查看每一秒的遮罩效果</p>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const maskVideo = document.getElementById('maskVideo');
        const slider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const recordBtn = document.getElementById('recordBtn');

        // 设置画布大小
        canvas.width = 360;
        canvas.height = 640;

        // 核心逻辑：绘制每一帧
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制白色背景（确保黑边被白色覆盖）
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 将 mask.mp4 的当前帧画到画布上
            // 使用 source-over 让视频里的黑色涂抹显示出来
            ctx.drawImage(maskVideo, 0, 0, canvas.width, canvas.height);
            
            // 这里可以根据你的具体特效逻辑（如 destination-out）进行调整
            // 目前保持简单绘制，方便你查看 mask.mp4 是否填满了画布
        }

        // 进度条控制：预览 0-5 秒
        slider.addEventListener('input', () => {
            const time = parseFloat(slider.value);
            maskVideo.currentTime = time;
            timeDisplay.innerText = time.toFixed(1);
        });

        // 视频跳转时重绘
        maskVideo.addEventListener('seeked', drawFrame);

        // 生成视频逻辑
        recordBtn.onclick = async () => {
            recordBtn.disabled = true;
            recordBtn.innerText = "正在录制 5 秒...";
            
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "result_5s.mp4";
                a.click();
                recordBtn.disabled = false;
                recordBtn.innerText = "生成并下载 5 秒视频";
            };

            // 循环播放录制
            maskVideo.currentTime = 0;
            await maskVideo.play();
            recorder.start();

            // 强制 5 秒后停止
            setTimeout(() => {
                recorder.stop();
                maskVideo.pause();
            }, 5000);
        };

        // 初始化显示第一帧
        maskVideo.addEventListener('loadeddata', drawFrame);
    </script>
</body>
</html>
