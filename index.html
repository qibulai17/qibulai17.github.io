<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 视频特效生成器</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { position: relative; width: 360px; height: 640px; background: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; object-fit: contain; } /* 保持原比例，不拉伸 */
        #maskVideo { display: none; }
        
        .controls { width: 360px; margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .progress-box { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="range"] { width: 100%; height: 8px; border-radius: 5px; background: #ddd; accent-color: #fb7299; }
        button { padding: 15px; background: #fb7299; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        .time-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <video id="maskVideo" src="mask.mp4" muted playsinline crossorigin="anonymous"></video>

    <div class="controls">
        <div class="progress-box">
            <div class="time-label">
                <span>预览时间进度</span>
                <span><b id="timeVal">0.0</b> / 5.0s</span>
            </div>
            <input type="range" id="previewBar" min="0" max="5" step="0.1" value="0">
        </div>
        
        <button id="recordBtn">导出 5 秒合成视频</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const maskVideo = document.getElementById('maskVideo');
        const previewBar = document.getElementById('previewBar');
        const timeVal = document.getElementById('timeVal');
        const recordBtn = document.getElementById('recordBtn');

        // 设置高清画布比例
        canvas.width = 720;
        canvas.height = 1280;

        // 这里是你之前的 3x3 核心特效逻辑
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 先画底层黑色（或者你的原视频底层）
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 绘制遮罩视频（关键：保持 contain 比例，不拉伸）
            const vWidth = maskVideo.videoWidth;
            const vHeight = maskVideo.videoHeight;
            const ratio = Math.min(canvas.width / vWidth, canvas.height / vHeight);
            const newWidth = vWidth * ratio;
            const newHeight = vHeight * ratio;
            const offX = (canvas.width - newWidth) / 2;
            const offY = (canvas.height - newHeight) / 2;

            ctx.drawImage(maskVideo, offX, offY, newWidth, newHeight);

            // 3. 这里会自动应用你 mask.mp4 里的黑白擦除逻辑
            // 如果你的代码之前有特殊的 globalCompositeOperation，请告诉我
        }

        // B站同款进度条：手动预览 5 秒内的每一帧
        previewBar.addEventListener('input', () => {
            const t = parseFloat(previewBar.value);
            maskVideo.currentTime = t;
            timeVal.innerText = t.toFixed(1);
        });

        maskVideo.onseeked = drawFrame;
        maskVideo.onloadedmetadata = () => {
            previewBar.max = 5; // 强制预览上限为 5 秒
            drawFrame();
        };

        // 导出逻辑：严格录制 0-5 秒
        recordBtn.onclick = async () => {
            recordBtn.disabled = true;
            recordBtn.innerText = "录制中 (0-5秒)...";
            
            const chunks = [];
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "final_effect_5s.mp4";
                a.click();
                recordBtn.disabled = false;
                recordBtn.innerText = "导出 5 秒合成视频";
            };

            maskVideo.currentTime = 0;
            await maskVideo.play();
            recorder.start();

            // 计时器：5秒后准时停止
            setTimeout(() => {
                recorder.stop();
                maskVideo.pause();
            }, 5000);
        };
    </script>
</body>
</html>
