<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>朋友圈全能切割神器 - By qibulai17</title>
    <style>
        :root { --primary: #07c160; --bg: #f8f9fa; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        select, input[type="text"] { padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .upload-btn { background: var(--primary); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; display: inline-block; font-weight: bold; }
        #grid-container { display: grid; gap: 10px; margin-top: 20px; justify-content: center; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); max-width: 500px; margin-left: auto; margin-right: auto; }
        canvas { width: 100%; border-radius: 4px; border: 1px solid #eee; transition: transform 0.2s; }
        canvas:hover { transform: scale(1.05); }
        .watermark-info { color: #ff5000; font-size: 0.85em; margin-top: 10px; }
        .footer { margin-top: 40px; border-top: 1px dotted #ccc; padding-top: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📸 朋友圈全能切割</h1>
        <p class="subtitle">九宫格 · 三联画 · 自动水印</p>

        <div class="controls">
            <select id="mode">
                <option value="9">九宫格 (3x3)</option>
                <option value="3">三联画 (1x3)</option>
            </select>
            <input type="text" id="watermarkText" placeholder="输入你的个性水印" value="@qibulai17">
        </div>

        <label class="upload-btn">
            上传图片开始变酷
            <input type="file" id="imageInput" accept="image/*" style="display:none">
        </label>

        <p class="watermark-info">✨ 提示：点击生成的图片可单独保存</p>
        <div id="grid-container" class="grid-3"></div>

        <div class="footer">
            <p>🚀 由 qibulai17 开发 | 觉得好用请分享给同学</p>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const gridContainer = document.getElementById('grid-container');
        const modeSelect = document.getElementById('mode');
        const watermarkInput = document.getElementById('watermarkText');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    processImage(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            gridContainer.innerHTML = '';
            const mode = parseInt(modeSelect.value);
            const watermark = watermarkInput.value;
            
            const cols = 3;
            const rows = (mode === 9) ? 3 : 1;
            
            const cellWidth = img.width / cols;
            const cellHeight = img.height / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = cellWidth;
                    canvas.height = cellHeight;

                    // 画图
                    ctx.drawImage(img, c * cellWidth, r * cellHeight, cellWidth, cellHeight, 0, 0, cellWidth, cellHeight);

                    // 加水印
                    if (watermark) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                        ctx.font = `${cellWidth / 15}px Arial`;
                        ctx.fillText(watermark, 10, cellHeight - 10);
                    }

                    gridContainer.appendChild(canvas);
                }
            }
        }
    </script>
</body>
</html>
