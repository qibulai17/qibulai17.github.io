<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - By qibulai17</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; --wx-name: #576b95; }
        body { font-family: -apple-system, Helvetica, sans-serif; background: var(--bg); margin: 0; padding: 10px; text-align: center; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; cursor: pointer; font-size: 14px; color: #666; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* --- 微信朋友圈排版 --- */
        .wx-post { display: flex; gap: 10px; text-align: left; padding: 15px; background: white; border-bottom: 1px solid #eee; margin: 20px auto; max-width: 100%; box-sizing: border-box;}
        .wx-avatar { width: 42px; height: 42px; background: #ddd; border-radius: 6px; flex-shrink: 0; }
        .wx-content { flex: 1; }
        .wx-name { color: var(--wx-name); font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        
        /* 视频容器：自适应比例 */
        .wx-media { 
            position: relative; 
            width: 100%; 
            background: #000; 
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
        }
        
        /* 用户视频：保持原始比例显示 */
        #user-video { 
            width: 100%; 
            height: auto; 
            display: block; 
        }
        
        /* 特效模板：强制100%铺满用户视频，不留黑边 */
        #mask-video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: fill; /* 关键：暴力铺满，消除左右黑边 */
            mix-blend-mode: screen; 
            z-index: 10;
            pointer-events: none;
            display: none; /* 初始隐藏 */
        }

        .wx-footer { color: #b2b2b2; font-size: 13px; margin-top: 10px; }

        .btn { background: var(--primary); color: white; padding: 12px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-sub { background: #f8f8f8; color: #666; font-size: 13px; border: 1px dashed #ddd; margin-bottom: 10px; }

        #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; background: #eee; padding: 5px; }
        .img-unit img { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📸 朋友圈全能工具箱</h3>
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('cut')">九宫格切割</button>
            <button class="tab-btn" onclick="showTab('video')">高级擦开特效</button>
        </div>

        <div id="tab-cut" class="content-section active">
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">选择照片切割</button>
            <div id="grid-container"></div>
        </div>

        <div id="tab-video" class="content-section">
            <input type="file" id="maskVideoInput" accept="video/*" style="display:none">
            <button class="btn btn-sub" onclick="document.getElementById('maskVideoInput').click()">1. 上传特效模板视频</button>
            
            <input type="file" id="userVideoInput" accept="video/*" style="display:none">
            <button class="btn" style="background:#333;" onclick="document.getElementById('userVideoInput').click()">2. 上传你要发的短视频</button>
            
            <div class="wx-post">
                <div class="wx-avatar"><img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=1" style="width:100%"></div>
                <div class="wx-content">
                    <div class="wx-name">朋友圈特效达人</div>
                    <div class="wx-media" id="media-box">
                        <video id="user-video" loop muted playsinline></video>
                        <video id="mask-video" loop muted playsinline></video>
                    </div>
                    <div class="wx-footer">刚刚</div>
                </div>
            </div>
            
            <button class="btn" onclick="runErase()">🔄 开始/重播特效</button>
        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const uv = document.getElementById('user-video');
        const mv = document.getElementById('mask-video');

        document.getElementById('maskVideoInput').onchange = function(e) {
            if(e.target.files[0]) {
                mv.src = URL.createObjectURL(e.target.files[0]);
                mv.style.display = 'block';
            }
        };

        document.getElementById('userVideoInput').onchange = function(e) {
            if(e.target.files[0]) {
                uv.src = URL.createObjectURL(e.target.files[0]);
                uv.onloadedmetadata = () => runErase();
            }
        };

        function runErase() {
            if (!uv.src || !mv.src) return alert("请先上传模板和视频！");
            uv.currentTime = 0; mv.currentTime = 0;
            uv.play(); mv.play();
        }

        // 九宫格逻辑
        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const grid = document.getElementById('grid-container');
                    grid.innerHTML = '';
                    const size = Math.min(img.width/3, img.height/3);
                    for(let i=0; i<9; i++) {
                        const canvas = document.createElement('canvas');
                        canvas.width = canvas.height = 800;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, (i%3)*size, Math.floor(i/3)*size, size, size, 0, 0, 800, 800);
                        const data = canvas.toDataURL("image/jpeg");
                        grid.innerHTML += `<div class="img-unit"><img src="${data}"></div>`;
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
