<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈工具箱 - 极速合成版</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #eee; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; color: #666; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 视频容器 */
        .wx-post { display: flex; gap: 10px; text-align: left; padding: 15px; background: white; border: 1px solid #eee; border-radius: 10px; margin-top: 20px; }
        .wx-avatar { width: 42px; height: 42px; background: #e0e0e0; border-radius: 6px; }
        .wx-content { flex: 1; }
        .wx-media { position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; min-height: 150px; }
        #final-video { width: 100%; height: auto; display: none; z-index: 20; }
        
        /* 进度条样式 */
        .progress-box { margin: 15px 0; display: none; }
        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }
        #status-text { font-size: 12px; color: #666; margin-top: 5px; }

        .btn { background: var(--primary); color: white; padding: 14px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        #recording-canvas { display: none; }
        #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .img-unit img { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📸 朋友圈全能工具箱</h3>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('cut')">九宫格</button>
            <button class="tab-btn" onclick="showTab('video')">视频擦开</button>
        </div>

        <div id="section-cut" class="content-section active">
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">选择照片切割</button>
            <div id="grid-container"></div>
        </div>

        <div id="section-video" class="content-section">
            <input type="file" id="maskInput" accept="video/*" style="display:none">
            <button class="btn" style="background:#576b95" onclick="document.getElementById('maskInput').click()">1. 上传擦除模板</button>
            
            <input type="file" id="userInput" accept="video/*" style="display:none">
            <button class="btn" style="background:#333" onclick="document.getElementById('userInput').click()">2. 上传你的原视频</button>

            <div class="progress-box" id="p-box">
                <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
                <div id="status-text">准备合成中...</div>
            </div>

            <div class="wx-post">
                <div class="wx-avatar"></div>
                <div class="wx-content">
                    <div style="color:#576b95; font-weight:bold; margin-bottom:5px;">预览生成结果 ✨</div>
                    <div class="wx-media">
                        <video id="final-video" controls playsinline></video>
                        <div id="placeholder" style="color:#999; font-size:12px; padding:60px 0; text-align:center;">
                            上传后点击下方按钮生成<br>(生成后可长按保存)
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="btn" id="gen-btn" onclick="processVideo()">🚀 立即合成预览视频</button>
        </div>
    </div>

    <canvas id="recording-canvas"></canvas>
    <video id="v-u" style="display:none" muted playsinline></video>
    <video id="v-m" style="display:none" muted playsinline></video>

    <script>
        function showTab(t) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + t).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const vU = document.getElementById('v-u');
        const vM = document.getElementById('v-m');
        const cvs = document.getElementById('recording-canvas');
        const ctx = cvs.getContext('2d');
        const fV = document.getElementById('final-video');
        const gBtn = document.getElementById('gen-btn');
        const pBox = document.getElementById('p-box');
        const pFill = document.getElementById('p-fill');
        const sTxt = document.getElementById('status-text');

        document.getElementById('maskInput').onchange = (e) => vM.src = URL.createObjectURL(e.target.files[0]);
        document.getElementById('userInput').onchange = (e) => vU.src = URL.createObjectURL(e.target.files[0]);

        async function processVideo() {
            if (!vU.src || !vM.src) return alert("素材不全！");
            
            gBtn.disabled = true;
            pBox.style.display = 'block';
            fV.style.display = 'none';
            document.getElementById('placeholder').style.display = 'none';

            // 等待元数据加载获取宽高
            if (vU.videoWidth === 0) await new Promise(r => vU.onloadedmetadata = r);
            
            cvs.width = vU.videoWidth;
            cvs.height = vU.videoHeight;

            // 尝试多种编码格式，增强手机兼容性
            let mime = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
            if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';

            const stream = cvs.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: mime });
            const chunks = [];

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: mime.includes('mp4') ? 'video/mp4' : 'video/webm' });
                fV.src = URL.createObjectURL(blob);
                fV.style.display = 'block';
                pBox.style.display = 'none';
                gBtn.disabled = false;
                alert("生成完毕！长按视频保存。");
            };

            vU.currentTime = 0; vM.currentTime = 0;
            await vU.play(); await vM.play();
            recorder.start();

            function draw() {
                if (vU.paused || vU.ended) {
                    recorder.stop();
                    return;
                }

                // 进度计算
                const progress = (vU.currentTime / vU.duration) * 100;
                pFill.style.width = progress + '%';
                sTxt.innerText = `正在揉合画面... ${Math.round(progress)}%`;

                // 渲染画面
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(vU, 0, 0, cvs.width, cvs.height);
                
                ctx.globalCompositeOperation = 'screen';
                const s = 1.3; // 暴力放大 1.3 倍，确保边缘黑影出局
                ctx.drawImage(vM, (cvs.width - cvs.width*s)/2, (cvs.height - cvs.height*s)/2, cvs.width*s, cvs.height*s);

                requestAnimationFrame(draw);
            }
            draw();
        }

        // 九宫格逻辑保留...
        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const grid = document.getElementById('grid-container');
                    grid.innerHTML = '';
                    const size = Math.min(img.width / 3, img.height / 3);
                    for (let i = 0; i < 9; i++) {
                        const c = document.createElement('canvas');
                        c.width = c.height = 800;
                        const ct = c.getContext('2d');
                        ct.drawImage(img, (i % 3) * size + (img.width - size * 3) / 2, Math.floor(i / 3) * size + (img.height - size * 3) / 2, size, size, 0, 0, 800, 800);
                        const data = c.toDataURL("image/jpeg");
                        grid.innerHTML += `<div class="img-unit"><img src="${data}"></div>`;
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
