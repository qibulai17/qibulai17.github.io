<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - By qibulai17</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; padding: 15px; text-align: center; }
        .card { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab-btn { padding: 10px 20px; border: none; background: #eee; border-radius: 8px; cursor: pointer; color: #666; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 视频剪辑区专用样式 */
        #video-work-area { position: relative; width: 100%; max-width: 350px; margin: 20px auto; overflow: hidden; background: #000; border-radius: 10px; line-height: 0; }
        #moments-mask { position: absolute; top: 0; left: 0; width: 100%; z-index: 10; pointer-events: none; }
        #user-video { width: 100%; z-index: 5; }
        /* 擦除动画层 */
        #erase-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 8; transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .erased { transform: translateX(100%); }

        .upload-btn { background: var(--primary); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; display: inline-block; font-weight: bold; margin: 10px 0; }
        .action-btn { background: #333; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; margin-top: 10px; }
        
        /* 原有切图样式保留... */
        #grid-container { display: grid; gap: 6px; margin-top: 10px; background: #ededed; padding: 10px; border-radius: 12px; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .img-unit { position: relative; background: white; }
        .img-unit img { width: 100%; display: block; }
        .dl-btn { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.5); color: white; padding: 2px 6px; font-size: 10px; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📸 朋友圈全能工具箱</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('cut')">九宫格切割</button>
            <button class="tab-btn" onclick="switchTab('video')">视频擦开神器</button>
        </div>

        <div id="tab-cut" class="content-section active">
            <label class="upload-btn">选择照片<input type="file" id="imageInput" accept="image/*" style="display:none"></label>
            <div id="grid-container" class="grid-3"></div>
        </div>

        <div id="tab-video" class="content-section">
            <p style="font-size: 0.8em; color: #888;">1. 上传朋友圈截图 -> 2. 上传短视频 -> 3. 生成擦开特效</p>
            
            <label class="action-btn">步骤1：上传朋友圈截图<input type="file" id="maskInput" accept="image/*" style="display:none"></label><br>
            <label class="action-btn" style="background:#576b95">步骤2：上传背景视频<input type="file" id="videoInput" accept="video/*" style="display:none"></label>
            
            <div id="video-work-area">
                <img id="moments-mask" src="" alt="">
                <div id="erase-layer"></div>
                <video id="user-video" loop muted playsinline></video>
            </div>

            <button class="upload-btn" onclick="startErase()">✨ 预览擦开特效</button>
            <p style="font-size: 0.7em; color: #ff5000;">提示：预览时使用手机录屏即可导出视频</p>
        </div>

        <div class="footer">
            <p>🚀 By qibulai17 | 你的全能剪辑助手</p>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- 视频剪辑逻辑 ---
        const maskInput = document.getElementById('maskInput');
        const videoInput = document.getElementById('videoInput');
        const momentsMask = document.getElementById('moments-mask');
        const userVideo = document.getElementById('user-video');
        const eraseLayer = document.getElementById('erase-layer');

        maskInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) momentsMask.src = URL.createObjectURL(file);
        });

        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                userVideo.src = URL.createObjectURL(file);
                userVideo.play();
                eraseLayer.classList.remove('erased');
            }
        });

        function startErase() {
            eraseLayer.classList.remove('erased');
            userVideo.currentTime = 0;
            userVideo.play();
            setTimeout(() => {
                eraseLayer.classList.add('erased');
            }, 500);
        }

        // --- 原有切图逻辑保留 ---
        const imageInput = document.getElementById('imageInput');
        const gridContainer = document.getElementById('grid-container');
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    gridContainer.innerHTML = '';
                    const size = Math.min(img.width/3, img.height/3);
                    for(let i=0; i<9; i++) {
                        const canvas = document.createElement('canvas');
                        canvas.width = canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, (i%3)*size, Math.floor(i/3)*size, size, size, 0, 0, size, size);
                        const unit = document.createElement('div');
                        unit.className = 'img-unit';
                        const nImg = document.createElement('img');
                        nImg.src = canvas.toDataURL("image/jpeg");
                        const btn = document.createElement('a');
                        btn.href = nImg.src; btn.download = `cut_${i}.jpg`;
                        btn.className = 'dl-btn'; btn.innerText = '保存';
                        unit.appendChild(nImg); unit.appendChild(btn);
                        gridContainer.appendChild(unit);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
