<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - 终极版</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; text-align: center; }
        .card { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .wx-post { display: flex; gap: 10px; text-align: left; padding: 15px; margin: 20px auto; }
        .wx-avatar { width: 40px; height: 40px; background: #ddd; border-radius: 4px; }
        .wx-content { flex: 1; }
        
        /* 核心修改：确保容器裁剪超出的部分 */
        .wx-media { 
            position: relative; 
            width: 100%; 
            background: #000; 
            border-radius: 4px;
            overflow: hidden; /* 这一行至关重要：把多出的黑边藏起来 */
            line-height: 0;
        }
        
        /* 用户视频 */
        #user-video { width: 100%; display: block; }
        
        /* 特效模板：改用 cover */
        #mask-video { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; /* 关键：放大填充，把黑边裁掉 */
            mix-blend-mode: screen; 
            z-index: 10;
            pointer-events: none;
        }

        .btn { background: var(--primary); color: white; padding: 12px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>✨ 朋友圈高级擦开特效</h3>
        
        <input type="file" id="maskVideoInput" accept="video/*" style="display:none">
        <button class="btn" style="background:#576b95" onclick="document.getElementById('maskVideoInput').click()">1. 上传特效模板</button>
        
        <input type="file" id="userVideoInput" accept="video/*" style="display:none">
        <button class="btn" onclick="document.getElementById('userVideoInput').click()">2. 上传短视频</button>
        
        <div class="wx-post">
            <div class="wx-avatar"></div>
            <div class="wx-content">
                <div style="color:#576b95; font-weight:bold; margin-bottom:5px;">特效达人</div>
                <div class="wx-media">
                    <video id="user-video" loop muted playsinline></video>
                    <video id="mask-video" loop muted playsinline></video>
                </div>
            </div>
        </div>
        
        <button class="btn" onclick="runErase()" style="background:#333">🎬 播放特效</button>
    </div>

    <script>
        const uv = document.getElementById('user-video');
        const mv = document.getElementById('mask-video');

        document.getElementById('maskVideoInput').onchange = (e) => {
            if(e.target.files[0]) mv.src = URL.createObjectURL(e.target.files[0]);
        };

        document.getElementById('userVideoInput').onchange = (e) => {
            if(e.target.files[0]) uv.src = URL.createObjectURL(e.target.files[0]);
        };

        function runErase() {
            uv.currentTime = 0; mv.currentTime = 0;
            uv.play(); mv.play();
        }
    </script>
</body>
</html>
