<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - By qibulai17</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; padding: 10px; text-align: center; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 视频区样式 */
        .v-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        #video-stage { position: relative; width: 100%; max-width: 320px; margin: 15px auto; background: #000; border-radius: 8px; overflow: hidden; min-height: 200px; }
        #moments-mask { position: absolute; top: 0; left: 0; width: 100%; z-index: 10; pointer-events: none; }
        #user-video { width: 100%; display: block; }
        #erase-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 8; transition: transform 1.2s ease-in-out; }
        .erased { transform: translateX(100%); }

        /* 按钮样式 */
        .btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-sub { background: #576b95; font-size: 13px; padding: 8px 15px; }

        /* 切图区样式 */
        #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; background: #eee; padding: 5px; }
        .img-unit { position: relative; }
        .img-unit img { width: 100%; display: block; }
        .dl { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📸 朋友圈全能工具箱</h3>
        <div class="tabs">
            <button class="tab-btn active" id="btn-cut" onclick="showTab('cut')">九宫格切割</button>
            <button class="tab-btn" id="btn-video" onclick="showTab('video')">视频擦开特效</button>
        </div>

        <div id="tab-cut" class="content-section active">
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">选择照片</button>
            <div id="grid-container"></div>
        </div>

        <div id="tab-video" class="content-section">
            <div class="v-box">
                <input type="file" id="maskInput" accept="image/*" style="display:none">
                <button class="btn btn-sub" onclick="document.getElementById('maskInput').click()">1. 上传朋友圈截图</button>
                <input type="file" id="videoInput" accept="video/*" style="display:none">
                <button class="btn btn-sub" style="background:#333" onclick="document.getElementById('videoInput').click()">2. 上传背景视频</button>
            </div>
            
            <div id="video-stage">
                <img id="moments-mask">
                <div id="erase-layer"></div>
                <video id="user-video" loop muted playsinline></video>
            </div>
            <button class="btn" onclick="runErase()">✨ 预览擦开特效</button>
        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        // --- 九宫格逻辑修复 ---
        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const grid = document.getElementById('grid-container');
                    grid.innerHTML = '';
                    const size = Math.min(img.width/3, img.height/3);
                    for(let i=0; i<9; i++) {
                        const canvas = document.createElement('canvas');
                        canvas.width = canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, (i%3)*size, Math.floor(i/3)*size, size, size, 0, 0, size, size);
                        const data = canvas.toDataURL("image/jpeg");
                        grid.innerHTML += `<div class="img-unit"><img src="${data}"><a href="${data}" download="cut_${i}.jpg" class="dl">保存</a></div>`;
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- 视频逻辑修复 ---
        document.getElementById('maskInput').onchange = function(e) {
            if(e.target.files[0]) document.getElementById('moments-mask').src = URL.createObjectURL(e.target.files[0]);
        };

        document.getElementById('videoInput').onchange = function(e) {
            const v = document.getElementById('user-video');
            if(e.target.files[0]) {
                v.src = URL.createObjectURL(e.target.files[0]);
                v.onloadedmetadata = () => v.play();
                document.getElementById('erase-layer').classList.remove('erased');
            }
        };

        function runErase() {
            const layer = document.getElementById('erase-layer');
            const v = document.getElementById('user-video');
            layer.classList.remove('erased');
            v.currentTime = 0;
            v.play();
            setTimeout(() => layer.classList.add('erased'), 300);
        }
    </script>
</body>
</html>
