<!-- 在 script 里的 render 函数部分，我做了强制同步修改 -->
<script>
    // ... 前面的代码保持一致 ...

    async function processVideo() {
        gBtn.disabled = true;
        statusTxt.innerText = "🚀 正在进行深度兼容性合成，请稍候...";
        
        cvs.width = vPreview.videoWidth;
        cvs.height = vPreview.videoHeight;

        // 强制使用最通用的 mimeType
        const mime = 'video/webm;codecs=vp8'; 
        const stream = cvs.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10000000 });
        const chunks = [];

        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            vFinal.src = URL.createObjectURL(blob);
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            statusTxt.innerText = "✅ 合成成功！若预览无特效，请直接下载到相册查看。";
            dBtn.style.display = 'block';
        };

        const startPoint = parseFloat(trimRange.value);
        vPreview.currentTime = startPoint;
        vMask.currentTime = 0;
        
        // 关键：等待视频跳转到指定位置再开始
        await new Promise(r => vPreview.onseeked = r);

        recorder.start();
        vPreview.play();
        vMask.play();

        const fps = 30;
        const interval = 1000 / fps;
        let lastDraw = 0;

        function render(now) {
            const elapsed = vPreview.currentTime - startPoint;
            
            if (elapsed >= 5 || vPreview.ended) {
                recorder.stop();
                vPreview.pause();
                vMask.pause();
                return;
            }

            // 强制每一帧都重新计算蒙版位置
            if (vMask.currentTime > 3.8) vMask.currentTime = 0;

            // 只有时间流逝了才画下一帧，防止重复帧导致文件过大或卡死
            if (now - lastDraw >= interval) {
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(vPreview, 0, 0, cvs.width, cvs.height);
                ctx.globalCompositeOperation = 'screen';
                ctx.drawImage(vMask, 0, 0, cvs.width, cvs.height);
                lastDraw = now;
            }
            
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }
</script>
