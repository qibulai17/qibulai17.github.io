<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 矩阵特效还原版</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .canvas-container { width: 360px; height: 640px; margin-top: 20px; position: relative; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { width: 100%; height: 100%; }
        .controls { width: 360px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .file-input-group { display: flex; flex-direction: column; gap: 8px; background: #333; padding: 10px; border-radius: 8px; }
        input[type="range"] { width: 100%; accent-color: #fb7299; }
        button { padding: 15px; background: #fb7299; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:disabled { background: #666; }
        label { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 隐藏的资源 -->
    <video id="maskVideo" src="mask.mp4" muted playsinline style="display:none;"></video>
    <video id="sourceVideo" muted playsinline style="display:none;"></video>

    <div class="controls">
        <div class="file-input-group">
            <label>1. 导入你的原视频 (要被特效处理的那个)</label>
            <input type="file" id="uploadSource" accept="video/*">
        </div>

        <div class="file-input-group">
            <label>2. 预览 5 秒特效进度</label>
            <input type="range" id="previewBar" min="0" max="5" step="0.1" value="0">
            <div style="display:flex; justify-content: space-between; font-size: 12px;">
                <span>0.0s</span>
                <span id="timeVal">0.0s</span>
                <span>5.0s</span>
            </div>
        </div>
        
        <button id="exportBtn">生成并下载 5 秒视频</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const maskVideo = document.getElementById('maskVideo');
        const sourceVideo = document.getElementById('sourceVideo');
        const uploadSource = document.getElementById('uploadSource');
        const previewBar = document.getElementById('previewBar');
        const timeVal = document.getElementById('timeVal');
        const exportBtn = document.getElementById('exportBtn');

        canvas.width = 720;
        canvas.height = 1280;

        // 导入原视频
        uploadSource.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                sourceVideo.src = URL.createObjectURL(file);
                sourceVideo.load();
            }
        };

        // 核心渲染逻辑：还原 3x3 切割
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 如果没传原视频，先画个黑色背景占位
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (sourceVideo.readyState >= 2) {
                // 绘制底层原视频
                ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
            }

            // 关键：应用蒙版特效
            ctx.globalCompositeOperation = 'destination-out'; 
            
            // 绘制你的 mask.mp4（这里会保留你 3x3 里的原始比例）
            // 如果你的 mask.mp4 已经是 3x3 的，它会直接作用于整个画面
            ctx.drawImage(maskVideo, 0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'source-over';
        }

        // 预览控制
        previewBar.oninput = () => {
            const t = parseFloat(previewBar.value);
            maskVideo.currentTime = t;
            // 让原视频也跟着预览走
            if (sourceVideo.duration) {
                sourceVideo.currentTime = t % sourceVideo.duration;
            }
            timeVal.innerText = t.toFixed(1) + 's';
        };

        maskVideo.onseeked = render;
        sourceVideo.onseeked = render;

        // 导出逻辑
        exportBtn.onclick = async () => {
            if (!sourceVideo.src) {
                alert("请先导入你的原视频！");
                return;
            }
            exportBtn.disabled = true;
            exportBtn.innerText = "正在导出 5 秒视频...";

            const chunks = [];
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "3x3_Effect_Result.mp4";
                a.click();
                exportBtn.disabled = false;
                exportBtn.innerText = "生成并下载 5 秒视频";
            };

            maskVideo.currentTime = 0;
            sourceVideo.currentTime = 0;
            
            recorder.start();
            maskVideo.play();
            sourceVideo.play();

            setTimeout(() => {
                recorder.stop();
                maskVideo.pause();
                sourceVideo.pause();
            }, 5000);
        };
    </script>
</body>
</html>
