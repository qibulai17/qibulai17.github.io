<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈特效工具</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .wx-post { display: flex; gap: 12px; padding: 15px; background: #fff; border: 1px solid #eee; border-radius: 12px; margin: 20px 0; text-align: left; }
        .wx-avatar { width: 42px; height: 42px; background: #eee; border-radius: 6px; flex-shrink: 0; }
        .wx-media { position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; min-height: 200px; line-height: 0; }
        #final-video { width: 100%; display: none; position: relative; z-index: 10; }
        .control-group { margin: 20px 0; text-align: left; }
        .trim-box { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #f0f0f0; }
        label { font-size: 14px; color: #333; font-weight: bold; display: block; margin-bottom: 10px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 3px; accent-color: var(--primary); }
        .status-box { display: none; margin: 15px 0; }
        .progress-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.2s; }
        #status-txt { font-size: 12px; color: #666; margin-top: 8px; text-align: center; }
        .btn { background: var(--primary); color: white; padding: 16px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        .btn:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin:0 0 10px 0; text-align:center;">✨ 特效生成器</h2>
        <p style="font-size:13px; color:#999; text-align:center; margin-bottom:25px;">上传视频 -> 选3秒片段 -> 生成特效</p>
        
        <input type="file" id="userInput" accept="video/*" style="display:none">
        <button class="btn" onclick="document.getElementById('userInput').click()">📂 上传我的原视频</button>

        <div class="control-group" id="editor" style="display:none">
            <div class="trim-box">
                <label id="time-label">✂️ 截取起点: 0.0s</label>
                <input type="range" id="trimRange" min="0" value="0" step="0.1">
                <p style="font-size:11px; color:#999; margin:8px 0 0 0;">(将自动往后截取 3 秒作为特效内容)</p>
            </div>
        </div>

        <div class="status-box" id="s-box">
            <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
            <p id="status-txt">正在准备画面...</p>
        </div>

        <div class="wx-post">
            <div class="wx-avatar"></div>
            <div class="wx-content" style="flex:1">
                <div style="color:#576b95; font-weight:bold; font-size:15px; margin-bottom:8px;">预览 (生成后长按保存)</div>
                <div class="wx-media">
                    <video id="final-video" controls playsinline webkit-playsinline></video>
                    <div id="placeholder" style="color:#bbb; font-size:13px; padding:80px 0; text-align:center;">等待合成...</div>
                </div>
            </div>
        </div>
        
        <button class="btn" id="gen-btn" style="background:#333;" onclick="processVideo()" disabled>🎬 开始合成特效</button>
    </div>

    <canvas id="recorder-canvas" style="display:none"></canvas>
    <video id="v-user" style="display:none" muted playsinline></video>
    <video id="v-mask" src="./mask.mp4" style="display:none" muted playsinline crossorigin="anonymous"></video>

    <script>
        const vU = document.getElementById('v-user');
        const vM = document.getElementById('v-mask');
        const cvs = document.getElementById('recorder-canvas');
        const ctx = cvs.getContext('2d');
        const trimRange = document.getElementById('trimRange');
        const gBtn = document.getElementById('gen-btn');
        const fV = document.getElementById('final-video');

        document.getElementById('userInput').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            vU.src = URL.createObjectURL(file);
            vU.onloadedmetadata = () => {
                document.getElementById('editor').style.display = 'block';
                gBtn.disabled = false;
                trimRange.max = Math.max(0, vU.duration - 3).toFixed(1);
            };
        };

        trimRange.oninput = () => {
            vU.currentTime = trimRange.value;
            document.getElementById('time-label').innerText = `✂️ 截取起点: ${parseFloat(trimRange.value).toFixed(1)}s`;
        };

        async function processVideo() {
            gBtn.disabled = true;
            document.getElementById('s-box').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            fV.style.display = 'none';

            cvs.width = vU.videoWidth;
            cvs.height = vU.videoHeight;

            let mime = 'video/mp4';
            if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
            
            const stream = cvs.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: mime });
            const chunks = [];

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                fV.src = URL.createObjectURL(blob);
                fV.style.display = 'block';
                document.getElementById('s-box').style.display = 'none';
                gBtn.disabled = false;
                alert("✅ 合成成功！长按预览区视频即可保存到相册。");
            };

            const startPoint = parseFloat(trimRange.value);
            vU.currentTime = startPoint;
            vM.currentTime = 0;
            
            await vU.play();
            await vM.play();
            recorder.start();

            function render() {
                const now = vU.currentTime - startPoint;
                const progress = (now / 3) * 100;
                document.getElementById('p-fill').style.width = Math.min(progress, 100) + '%';
                document.getElementById('status-txt').innerText = `正在合成: ${Math.min(Math.round(progress), 100)}%`;

                if (now >= 3 || vU.ended) {
                    recorder.stop();
                    vU.pause();
                    vM.pause();
                    return;
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(vU, 0, 0, cvs.width, cvs.height);
                ctx.globalCompositeOperation = 'screen';
                ctx.drawImage(vM, 0, 0, cvs.width, cvs.height);
                requestAnimationFrame(render);
            }
            render();
        }
    </script>
</body>
</html>
