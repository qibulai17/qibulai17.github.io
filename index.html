<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - By qibulai17</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; --wx-name: #576b95; }
        body { font-family: -apple-system, Helvetica, sans-serif; background: var(--bg); margin: 0; padding: 10px; text-align: center; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; cursor: pointer; font-size: 14px; color: #666; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* --- 纯代码画的微信朋友圈样式 --- */
        .wx-post { display: flex; gap: 10px; text-align: left; padding: 15px; background: white; border-bottom: 1px solid #eee; margin: 20px auto; max-width: 350px; }
        .wx-avatar { width: 42px; height: 42px; background: #ddd; border-radius: 6px; flex-shrink: 0; overflow: hidden; }
        .wx-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .wx-content { flex: 1; overflow: hidden; }
        .wx-name { color: var(--wx-name); font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        
        /* 视频容器 */
        .wx-media { position: relative; width: 85%; border-radius: 4px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
        #user-video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* 神奇的黑幕擦除层 */
        #scratch-cover { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #111; z-index: 10;
            /* 设置遮罩向右滑开的动画 */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
            transition: clip-path 1.2s ease-in-out; 
        }
        /* 擦开后的状态：把遮罩切到最右边消失 */
        .erased { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%) !important; }

        .wx-footer { color: #b2b2b2; font-size: 13px; margin-top: 10px; }

        .btn { background: var(--primary); color: white; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 80%; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }

        /* 九宫格样式保留 */
        #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; background: #eee; padding: 5px; }
        .img-unit { position: relative; }
        .img-unit img { width: 100%; display: block; }
        .dl { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📸 朋友圈全能工具箱</h3>
        <div class="tabs">
            <button class="tab-btn active" id="btn-cut" onclick="showTab('cut')">九宫格切割</button>
            <button class="tab-btn" id="btn-video" onclick="showTab('video')">视频擦开神器</button>
        </div>

        <div id="tab-cut" class="content-section active">
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">选择照片开始切割</button>
            <div id="grid-container"></div>
        </div>

        <div id="tab-video" class="content-section">
            <input type="file" id="videoInput" accept="video/*" style="display:none">
            <button class="btn" style="background:#333; margin-bottom: 10px;" onclick="document.getElementById('videoInput').click()">🚀 一键上传短视频</button>
            <p style="font-size: 12px; color: #888;">上传后自动套用朋友圈模板并播放特效</p>
            
            <div class="wx-post">
                <div class="wx-avatar">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="头像">
                </div>
                <div class="wx-content">
                    <div class="wx-name">那个Ta ✨</div>
                    <div class="wx-media">
                        <video id="user-video" loop muted playsinline></video>
                        <div id="scratch-cover"></div>
                    </div>
                    <div class="wx-footer">1分钟前</div>
                </div>
            </div>
            
            <button class="btn" style="width: 80%;" onclick="runErase()">🔄 再看一次特效</button>
            <p style="color:#ff5000; font-size:12px; margin-top:10px;">提示：播放时直接用手机录屏即可导出！</p>
        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        // --- 九宫格切割代码（完全保留且修复） ---
        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const grid = document.getElementById('grid-container');
                    grid.innerHTML = '';
                    const size = Math.min(img.width/3, img.height/3);
                    const startX = (img.width - size*3)/2;
                    const startY = (img.height - size*3)/2;
                    for(let i=0; i<9; i++) {
                        const canvas = document.createElement('canvas');
                        canvas.width = canvas.height = 800; // 保证清晰度
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, startX + (i%3)*size, startY + Math.floor(i/3)*size, size, size, 0, 0, 800, 800);
                        const data = canvas.toDataURL("image/jpeg", 0.9);
                        const unit = document.createElement('div');
                        unit.className = 'img-unit';
                        unit.innerHTML = `<img src="${data}"><a href="${data}" download="cut_${i}.jpg" class="dl">保存</a>`;
                        grid.appendChild(unit);
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- 视频自动化擦开代码 ---
        const v = document.getElementById('user-video');
        const cover = document.getElementById('scratch-cover');

        document.getElementById('videoInput').onchange = function(e) {
            if(e.target.files[0]) {
                v.src = URL.createObjectURL(e.target.files[0]);
                // 视频加载完成后自动触发动画
                v.onloadedmetadata = () => {
                    runErase();
                };
            }
        };

        function runErase() {
            // 1. 重置黑幕和视频
            cover.classList.remove('erased');
            v.currentTime = 0;
            v.pause();
            
            // 2. 稍微延迟一下，确保黑幕盖好了，然后再开始播放并擦除
            setTimeout(() => {
                v.play();
                cover.classList.add('erased');
            }, 300);
        }
    </script>
</body>
</html>
