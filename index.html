<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈全能工具箱 - 支持长按下载</title>
    <style>
        :root { --primary: #07c160; --bg: #f0f2f5; --wx-name: #576b95; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #eee; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; color: #666; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 九宫格样式 */
        #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; background: #eee; padding: 5px; border-radius: 8px; }
        .img-unit { position: relative; width: 100%; padding-top: 100%; overflow: hidden; background: #fff; }
        .img-unit img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .dl-btn { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; text-decoration: none; }

        /* 视频预览区 */
        .wx-post { display: flex; gap: 10px; text-align: left; padding: 15px; background: white; border: 1px solid #eee; border-radius: 10px; margin-top: 20px; }
        .wx-avatar { width: 42px; height: 42px; background: #e0e0e0; border-radius: 6px; flex-shrink: 0; }
        .wx-content { flex: 1; }
        .wx-name { color: var(--wx-name); font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        
        /* 核心展示区：显示最终生成的视频 */
        .wx-media { position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; line-height: 0; min-height: 100px; }
        #final-video { width: 100%; height: auto; display: none; z-index: 20; position: relative; }
        
        /* 录制时的临时画面 */
        #recording-canvas { display: none; }
        .loading-tip { font-size: 12px; color: #ff5000; margin: 10px 0; display: none; }

        .btn { background: var(--primary); color: white; padding: 14px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 15px; }
        .btn-sub { background: #f8f8f8; color: #666; font-size: 13px; border: 1px dashed #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="margin-top:0">📸 朋友圈工具箱 (支持长按下载)</h3>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('cut')">九宫格切割</button>
            <button class="tab-btn" onclick="showTab('video')">视频擦开生成</button>
        </div>

        <div id="section-cut" class="content-section active">
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button class="btn" onclick="document.getElementById('imageInput').click()">选择照片</button>
            <div id="grid-container"></div>
        </div>

        <div id="section-video" class="content-section">
            <input type="file" id="maskVideoInput" accept="video/*" style="display:none">
            <button class="btn btn-sub" onclick="document.getElementById('maskVideoInput').click()">1. 上传黑白模板</button>
            
            <input type="file" id="userVideoInput" accept="video/*" style="display:none">
            <button class="btn" style="background:#333" onclick="document.getElementById('userVideoInput').click()">2. 上传你的视频</button>
            
            <div class="loading-tip" id="status-text">⏳ 正在合成视频，请稍候...</div>

            <div class="wx-post">
                <div class="wx-avatar"></div>
                <div class="wx-content">
                    <div class="wx-name">预览生成结果 ✨</div>
                    <div class="wx-media" id="media-container">
                        <video id="final-video" controls playsinline></video>
                        <p id="placeholder" style="color:#666; font-size:12px; padding:40px 10px; text-align:center;">上传视频后点击下方按钮生成</p>
                    </div>
                    <div style="color:#b2b2b2; font-size:13px; margin-top:8px;">刚刚</div>
                </div>
            </div>
            
            <button class="btn" id="start-btn" onclick="startProcessing()">🚀 生成可下载视频</button>
            <p style="font-size: 11px; color: #999; margin-top: 10px;">生成成功后，直接【长按视频】即可保存到相册</p>
        </div>
    </div>

    <canvas id="recording-canvas"></canvas>
    <video id="v-user" style="display:none" muted loop playsinline></video>
    <video id="v-mask" style="display:none" muted loop playsinline></video>

    <script>
        function showTab(type) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + type).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const vUser = document.getElementById('v-user');
        const vMask = document.getElementById('v-mask');
        const canvas = document.getElementById('recording-canvas');
        const ctx = canvas.getContext('2d');
        const finalVideo = document.getElementById('final-video');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        // 上传处理
        document.getElementById('maskVideoInput').onchange = (e) => {
            if(e.target.files[0]) vMask.src = URL.createObjectURL(e.target.files[0]);
        };
        document.getElementById('userVideoInput').onchange = (e) => {
            if(e.target.files[0]) vUser.src = URL.createObjectURL(e.target.files[0]);
        };

        // 核心：合成并录制视频
        async function startProcessing() {
            if (!vUser.src || !vMask.src) return alert("请先上传模板和视频！");
            
            startBtn.disabled = true;
            statusText.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';

            // 设置画布大小为用户视频大小
            canvas.width = vUser.videoWidth;
            canvas.height = vUser.videoHeight;

            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                finalVideo.src = URL.createObjectURL(blob);
                finalVideo.style.display = 'block';
                statusText.innerText = "✅ 生成成功！长按下方视频保存";
                startBtn.disabled = false;
            };

            // 同步播放
            vUser.currentTime = 0;
            vMask.currentTime = 0;
            await vUser.play();
            await vMask.play();
            recorder.start();

            // 循环绘制
            function drawFrame() {
                if (vUser.paused || vUser.ended) {
                    recorder.stop();
                    vUser.pause();
                    vMask.pause();
                    return;
                }

                // 1. 画底层 (用户视频)
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(vUser, 0, 0, canvas.width, canvas.height);

                // 2. 画顶层 (模板视频) - 模拟 Screen 模式
                ctx.globalCompositeOperation = 'screen';
                // 这里的 1.25 是为了挤掉你说的模板边缘黑影
                const scale = 1.25;
                const sw = canvas.width * scale;
                const sh = canvas.height * scale;
                ctx.drawImage(vMask, (canvas.width - sw)/2, (canvas.height - sh)/2, sw, sh);

                requestAnimationFrame(drawFrame);
            }
            drawFrame();
        }

        // 九宫格切割 (保留)
        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const grid = document.getElementById('grid-container');
                    grid.innerHTML = '';
                    const size = Math.min(img.width / 3, img.height / 3);
                    for (let i = 0; i < 9; i++) {
                        const c = document.createElement('canvas');
                        c.width = c.height = 800;
                        const ct = c.getContext('2d');
                        ct.drawImage(img, (i % 3) * size + (img.width - size * 3) / 2, Math.floor(i / 3) * size + (img.height - size * 3) / 2, size, size, 0, 0, 800, 800);
                        const data = c.toDataURL("image/jpeg");
                        grid.innerHTML += `<div class="img-unit"><img src="${data}"><a href="${data}" download="cut_${i+1}.jpg" class="dl-btn">保存</a></div>`;
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
